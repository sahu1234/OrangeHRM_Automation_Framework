# ==========================================
# 1. Login Page Locators (format -> type:value)
# ==========================================
login.username.field=name:username
login.password.field=name:password
login.submit.button=css:button.orangehrm-login-button
login.error.banner=css:.oxd-alert-content-text

# ==========================================
# 2. Dashboard & Navigation Locators
# ==========================================
dashboard.header.title=xpath://h6[contains(@class,'oxd-topbar-header-breadcrumb-module')]
dashboard.user.dropdown=css:.oxd-userdropdown-tab
dashboard.logout.link=xpath://a[normalize-space() = 'Logout']
dashboard.menu.admin=xpath://span[normalize-space() = 'Admin']
dashboard.menu.pim=xpath://span[normalize-space()= 'PIM']
dashboard.menu.leave=xpath://span[normalize-space()= 'Leave']